{% assign projeto = include.projeto %}
<div class="project-card{% if projeto.featured %} featured{% endif %}">
  <div class="project-header">
    <h3>{{ projeto.title | escape }}</h3>
    {% if projeto.featured %}
    {% endif %}
  </div>

  {% if projeto.image %}
    <div class="project-image">
      <img src="{{ projeto.image }}" alt="{{ projeto.title | escape }}" loading="lazy" decoding="async">
    </div>
  {% endif %}

  <p class="project-description">{{ projeto.description | default: projeto.excerpt }}</p>

  {% if projeto.stack %}
    <div class="project-stack">
      <span class="tech-stack">{{ projeto.stack | escape }}</span>
    </div>
  {% endif %}

  <div class="project-footer">
    <a href="{{ projeto.url }}">
      <i class="bi bi-arrow-right-circle" style="padding-right: 0.3rem"></i>
      <span data-pt="Saiba mais" data-en="Read more">Saiba mais</span>
    </a>
  </div>
</div>
