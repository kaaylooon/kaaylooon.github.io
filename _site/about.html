    <div class="post-content"
         data-pt="
            <p>Estudei matemática por obras nacionais e dei algumas 'olhadas' em
            clássicos internacionais (Titu, por exemplo). Completei a base com
            máximo aprofundamento, e também passei pelo conteúdo do superior:
            cálculo, álgebra linear, teoria dos números etc. Em física,
            completei a física clássica e tive contato com o superior: relatividade, moderna etc.</p>
            <p>Em programação, passei um tempo considerável com Python e C++, usando RayLib para simulações físicas (colisões, n-body problem…). É um hobby interessante.</p>
            <p>Quero ser poliglota. É um dos meus objetivos — em breve, colocarei em prática.</p>
            <p>Não são menções vagas de 'qualificações'. Estas são algumas coisas que me definem.</p>
            <blockquote>
                'It is a ridiculous thing for a man not to fly from his own badness, which is indeed possible, but to fly from other men's badness, which is impossible.'<br>
                — Marco Aurélio, Meditações
            </blockquote>
         "
         data-en="
            <p>I studied mathematics through national works and took a look at international classics (Titu, for example). I covered all high school content with maximum depth, and also went through calculus, linear algebra, number theory, etc. In physics, I completed the basics and had contact with higher-level topics: relativity, modern physics, etc.</p>
            <p>In programming, I spent considerable time with Python and C++, using RayLib for physical simulations (collisions, n-body problem…). It's an interesting hobby.</p>
            <p>I want to be a polyglot. It's one of my goals — I'll put it into practice soon.</p>
            <p>These are not vague mentions of 'qualifications.' These are some of the things that define me.</p>
            <blockquote>
                'It is a ridiculous thing for a man not to fly from his own badness, which is indeed possible, but to fly from other men's badness, which is impossible.'<br>
                — Marcus Aurelius, Meditations
            </blockquote>
         ">
        <!-- O conteúdo inicial (português) será inserido pelo JavaScript -->

<script>
    (function() {
        let currentLang = 'pt';
        const toggleBtn = document.getElementById('langToggle');

        function setLanguage(lang) {
            const elements = document.querySelectorAll('[data-en][data-pt]');
            elements.forEach(el => {
                const html = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-pt');
                if (html) el.innerHTML = html;
            });
            toggleBtn.innerHTML = lang === 'en' ? '🇧🇷' : '🇺🇸';
            currentLang = lang;
            document.documentElement.lang = lang;
        }

        toggleBtn.addEventListener('click', () => {
            setLanguage(currentLang === 'en' ? 'pt' : 'en');
        });

        setLanguage('pt');
    })();
</script>
