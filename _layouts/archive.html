---
layout: null
og_type: website
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pt' }}">
<head>
    {% include site-head.html %}
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N8XJL7JC"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

{% include site-nav.html %}

<main class="container">
    <a href="/" class="back-link">
        <i class="bi bi-arrow-left"></i> <span data-en="Back" data-pt="Voltar">Voltar</span>
    </a>

    <article class="post-header">
        <h1>{{ page.title | escape }}</h1>
        <div class="post-meta">
            <span class="date"><i class="bi bi-journal-text"></i> {{ site.posts | size }} <span data-en="posts" data-pt="publicações">publicações</span></span>
        </div>
    </article>

    <div class="archive-intro post-content">
        {{ content }}
    </div>
</main>

{% include site-footer.html %}

<script src="{{ '/assets/lang-toggle.js' | relative_url }}" defer></script>

</body>
</html>
